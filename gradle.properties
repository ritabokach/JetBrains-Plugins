#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Marketplace API
# Base address of the JetBrains Marketplace API. Kept out of the sources on
# purpose: the build generates ApiConfig from it. Override with -Pmarketplace.baseUrl=...
marketplace.baseUrl=https://plugins.jetbrains.com
